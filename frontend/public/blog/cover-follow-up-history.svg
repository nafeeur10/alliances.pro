<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Company follow-ups: a What happened? summary and a follow-up history with Email, WhatsApp, Call and Meeting entries">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0369A1"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="wa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="call" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="meet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="1440" cy="120" r="110"/>
    <circle cx="1440" cy="120" r="190"/>
    <circle cx="140" cy="140" r="150"/>
  </g>

  <!-- "What happened?" completion card -->
  <g transform="translate(120 190)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="500" height="470" rx="28" fill="#FFFFFF" opacity="0.97"/>
    <circle cx="62" cy="64" r="24" fill="url(#wa)"/>
    <path d="M51 64 l8 8 l14 -16" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="74" font-size="30" font-weight="700" fill="#1E1B4B">What happened?</text>
    <rect x="38" y="118" width="424" height="168" rx="16" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="2"/>
    <rect x="62" y="146" width="340" height="14" rx="7" fill="#6366F1"/>
    <rect x="62" y="176" width="370" height="12" rx="6" fill="#C7D2FE"/>
    <rect x="62" y="202" width="300" height="12" rx="6" fill="#C7D2FE"/>
    <rect x="62" y="228" width="220" height="12" rx="6" fill="#C7D2FE"/>
    <rect x="62" y="254" width="3" height="18" fill="#4F46E5"/>
    <!-- Channel chips -->
    <g font-size="15" font-weight="700">
      <rect x="38" y="308" width="92" height="34" rx="17" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
      <text x="84" y="330" text-anchor="middle" fill="#4338CA">Email</text>
      <rect x="140" y="308" width="118" height="34" rx="17" fill="#F0FDF4"/>
      <text x="199" y="330" text-anchor="middle" fill="#15803D">WhatsApp</text>
      <rect x="268" y="308" width="78" height="34" rx="17" fill="#FFFBEB"/>
      <text x="307" y="330" text-anchor="middle" fill="#B45309">Call</text>
      <rect x="356" y="308" width="106" height="34" rx="17" fill="#FDF2F8"/>
      <text x="409" y="330" text-anchor="middle" fill="#BE185D">Meeting</text>
    </g>
    <rect x="38" y="380" width="208" height="54" rx="14" fill="#4F46E5"/>
    <text x="142" y="414" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Save summary</text>
    <rect x="260" y="380" width="120" height="54" rx="14" fill="#EEF2FF"/>
    <text x="320" y="414" text-anchor="middle" font-size="19" font-weight="600" fill="#4338CA">Cancel</text>
  </g>

  <!-- Flow arrow -->
  <g transform="translate(640 418)">
    <rect width="90" height="16" rx="8" fill="url(#flow)" opacity="0.9"/>
    <path d="M86 -18 L130 8 L86 34 Z" fill="#DDD6FE"/>
  </g>

  <!-- Company: Follow-ups tab with history -->
  <g transform="translate(790 110)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="690" height="610" rx="28" fill="#FFFFFF" opacity="0.97"/>
    <rect x="40" y="40" width="240" height="22" rx="11" fill="#1E1B4B"/>
    <rect x="40" y="76" width="320" height="12" rx="6" fill="#A5B4FC"/>
    <!-- Tabs: Follow-ups first and active -->
    <g font-size="17" font-weight="700">
      <rect x="40" y="114" width="150" height="42" rx="12" fill="#4F46E5"/>
      <text x="115" y="141" text-anchor="middle" fill="#FFFFFF">Follow-ups</text>
      <text x="246" y="141" text-anchor="middle" fill="#64748B">Leads</text>
      <text x="340" y="141" text-anchor="middle" fill="#64748B">Notes</text>
      <text x="440" y="141" text-anchor="middle" fill="#64748B">Files</text>
    </g>
    <rect x="40" y="170" width="610" height="2" fill="#E0E7FF"/>

    <!-- Email (logged automatically) -->
    <g transform="translate(40 192)">
      <rect width="610" height="92" rx="16" fill="#F8FAFC" stroke="#E0E7FF"/>
      <circle cx="46" cy="46" r="26" fill="url(#mail)"/>
      <rect x="32" y="36" width="28" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M32 38 L46 49 L60 38" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <rect x="90" y="26" width="180" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="90" y="52" width="320" height="11" rx="5.5" fill="#C7D2FE"/>
      <rect x="470" y="20" width="114" height="28" rx="14" fill="#E0E7FF"/>
      <text x="527" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#4338CA">Auto-logged</text>
    </g>

    <!-- WhatsApp -->
    <g transform="translate(40 298)">
      <rect width="610" height="92" rx="16" fill="#F8FAFC" stroke="#E0E7FF"/>
      <circle cx="46" cy="46" r="26" fill="url(#wa)"/>
      <path d="M34 58 L37 49 A13 13 0 1 1 42 54 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <rect x="90" y="26" width="150" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="90" y="52" width="360" height="11" rx="5.5" fill="#BBF7D0"/>
      <rect x="490" y="20" width="94" height="28" rx="14" fill="#DCFCE7"/>
      <text x="537" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">Done</text>
    </g>

    <!-- Call -->
    <g transform="translate(40 404)">
      <rect width="610" height="92" rx="16" fill="#F8FAFC" stroke="#E0E7FF"/>
      <circle cx="46" cy="46" r="26" fill="url(#call)"/>
      <path d="M36 34 q-2 4 2 12 q6 10 14 13 q5 2 8 -1 l-5 -6 l-5 2 q-6 -3 -9 -9 l2 -5 l-6 -6 Z" fill="#FFFFFF"/>
      <rect x="90" y="26" width="170" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="90" y="52" width="280" height="11" rx="5.5" fill="#FDE68A"/>
      <rect x="490" y="20" width="94" height="28" rx="14" fill="#DCFCE7"/>
      <text x="537" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">Done</text>
    </g>

    <!-- Meeting -->
    <g transform="translate(40 510)">
      <rect width="610" height="72" rx="16" fill="#F8FAFC" stroke="#E0E7FF"/>
      <circle cx="46" cy="36" r="24" fill="url(#meet)"/>
      <rect x="34" y="26" width="24" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M34 33 H58 M40 22 V29 M52 22 V29" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <rect x="90" y="22" width="140" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="90" y="46" width="240" height="11" rx="5.5" fill="#FBCFE8"/>
    </g>
  </g>

  <text x="120" y="800" font-family="ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" opacity="0.97">Follow-ups that tell the whole story</text>
  <text x="120" y="850" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="500" fill="#E0E7FF">What happened? · Emails logged automatically · Email, WhatsApp, Call, Meeting</text>
</svg>
