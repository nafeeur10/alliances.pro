    <rect x="36" y="76" width="300" height="12" rx="6" fill="#A7F3D0"/>
    <g transform="translate(36 128)">
      <rect width="368" height="72" rx="14" fill="#ECFDF5"/>
      <circle cx="40" cy="36" r="18" fill="#10B981"/>
      <path d="M31 36 l6 6 l12 -13" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="74" y="22" width="170" height="12" rx="6" fill="#065F46"/>
      <rect x="74" y="42" width="120" height="10" rx="5" fill="#6EE7B7"/>
    </g>
    <g transform="translate(36 216)">
      <rect width="368" height="72" rx="14" fill="#ECFDF5"/>
      <circle cx="40" cy="36" r="18" fill="#10B981"/>
      <path d="M31 36 l6 6 l12 -13" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="74" y="22" width="150" height="12" rx="6" fill="#065F46"/>
      <rect x="74" y="42" width="100" height="10" rx="5" fill="#6EE7B7"/>
