      <rect x="60" y="374" width="160" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="380" y="368" width="120" height="26" rx="13" fill="#FFE4E6"/>
      <text x="440" y="386" text-anchor="middle" fill="#BE123C">Uninstalled</text>
    </g>
    <rect x="40" y="444" width="150" height="40" rx="10" fill="#4F46E5"/>
    <rect x="204" y="444" width="130" height="40" rx="10" fill="#EEF2FF"/>
  </g>

  <text x="80" y="800" font-family="ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" opacity="0.97">Shopify Partner integration</text>
  <text x="80" y="850" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="500" fill="#D1FAE5">Installs · Uninstalls · Merchant follow-ups</text>
