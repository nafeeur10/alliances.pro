      <rect x="74" y="22" width="160" height="12" rx="6" fill="#881337"/>
      <rect x="74" y="42" width="110" height="10" rx="5" fill="#FDA4AF"/>
    </g>
  </g>

  <!-- Flow arrow -->
  <g transform="translate(620 390)">
    <rect width="220" height="16" rx="8" fill="url(#flow)" opacity="0.9"/>
    <path d="M214 -18 L262 8 L214 34 Z" fill="#C7D2FE"/>
