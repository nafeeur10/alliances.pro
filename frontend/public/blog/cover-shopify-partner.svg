    <rect x="40" y="44" width="220" height="22" rx="11" fill="#312E81"/>
    <rect x="40" y="82" width="340" height="12" rx="6" fill="#A5B4FC"/>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">
      <rect x="40" y="130" width="480" height="40" rx="10" fill="#EEF2FF"/>
      <rect x="40" y="190" width="480" height="64" rx="12" fill="#F8FAFC" stroke="#E0E7FF"/>
      <rect x="60" y="214" width="170" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="400" y="208" width="100" height="26" rx="13" fill="#D1FAE5"/>
      <text x="450" y="226" text-anchor="middle" fill="#047857">Installed</text>
      <rect x="40" y="270" width="480" height="64" rx="12" fill="#F8FAFC" stroke="#E0E7FF"/>
      <rect x="60" y="294" width="140" height="14" rx="7" fill="#1E1B4B"/>
      <rect x="400" y="288" width="100" height="26" rx="13" fill="#D1FAE5"/>
